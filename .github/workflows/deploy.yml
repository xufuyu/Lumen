name: Deploy to Tencent Cloud

on:
  push:
    branches: [main]
  workflow_dispatch:  # 支持手动触发

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false  # 部署不能被打断

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # 中继 IP 从 Secret 读取，方便日后换机不用改代码
      RELAY_HOST: ${{ secrets.RELAY_HOST }}
      OLD_HOST: advx.fzxufuyu.eu.org
      APP_DIR: /opt/lumen
      REMOTE_USER: ${{ secrets.DEPLOY_USER }}
      REMOTE_HOST: ${{ secrets.DEPLOY_HOST }}
      REMOTE_PORT: ${{ secrets.DEPLOY_PORT || '22' }}

    steps:
      - uses: actions/checkout@v4

      # ── 前置校验：Secret 必须齐全 ─────────────────────────────
      - name: Validate secrets
        run: |
          missing=()
          [ -n "${RELAY_HOST}" ]                       || missing+=("RELAY_HOST")
          [ -n "${REMOTE_HOST}" ]                      || missing+=("DEPLOY_HOST")
          [ -n "${REMOTE_USER}" ]                      || missing+=("DEPLOY_USER")
          [ -n "${{ secrets.DEPLOY_SSH_KEY }}" ]       || missing+=("DEPLOY_SSH_KEY")
          [ -n "${{ secrets.RELAY_CA_PEM }}" ]         || missing+=("RELAY_CA_PEM")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "ERROR: 以下 Secret 未配置: ${missing[*]}"
            exit 1
          fi
          echo "✓ Secrets OK: RELAY_HOST=${RELAY_HOST}, DEPLOY_HOST=${REMOTE_HOST}"

      # ── 前端构建 ─────────────────────────────────────────────
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci --prefer-offline --no-audit --no-fund
          npx vite build --outDir ../deploy/static --emptyOutDir

      # ── 后端打包 ─────────────────────────────────────────────
      - name: Pack backend
        run: |
          mkdir -p deploy/backend
          cp -r backend/* deploy/backend/
          find deploy/backend -type d -name __pycache__ -exec rm -rf {} + 2>/dev/null || true
          find deploy/backend -type f -name '*.pyc' -delete 2>/dev/null || true
          # 删除本地开发用的 .env（服务器有自己的）
          rm -f deploy/backend/.env

      # ── 全局替换域名 → IP ───────────────────────────────────
      - name: Rewrite relay host
        run: |
          echo "==> 替换 ${OLD_HOST} → ${RELAY_HOST}"
          # 前端产物 (JS bundle 里可能有硬编码，虽然一般走 /api 相对路径)
          grep -rl "${OLD_HOST}" deploy/ 2>/dev/null | while read f; do
            sed -i "s|${OLD_HOST}|${RELAY_HOST}|g" "$f"
            echo "  patched: $f"
          done
          # 显式改后端 config.py 里的默认值（防止 .env 未配置时 fallback 到旧域名）
          sed -i "s|${OLD_HOST}|${RELAY_HOST}|g" deploy/backend/config.py

      # ── 自签 CA 证书从 Secret 落盘 ───────────────────────────
      - name: Inject self-signed CA
        env:
          CA_PEM: ${{ secrets.RELAY_CA_PEM }}
        run: |
          if [ -z "${CA_PEM}" ]; then
            echo "ERROR: Secret RELAY_CA_PEM 未配置"
            exit 1
          fi
          mkdir -p deploy/backend/certs
          printf "%s" "${CA_PEM}" > deploy/backend/certs/relay-ca.pem
          # 简单校验是不是合法 PEM
          openssl x509 -in deploy/backend/certs/relay-ca.pem -noout -subject -issuer -dates
          chmod 644 deploy/backend/certs/relay-ca.pem

      # ── 生成 .env（覆盖旧值） ────────────────────────────────
      - name: Generate .env
        run: |
          cat > deploy/lumen.env <<ENV
          # 由 GitHub Actions 自动生成 — 请勿手动编辑（会被下次部署覆盖）
          RELAY_BASE_URL=https://${RELAY_HOST}/v1
          RELAY_API_KEY=sk-relay
          ASR_RELAY_WS_URL=wss://${RELAY_HOST}/v1/realtime/asr/stream
          RELAY_CA_BUNDLE=${APP_DIR}/backend/certs/relay-ca.pem
          RELAY_TLS_INSECURE=false
          MODEL_PRO=deepseek-v4-flash
          MODEL_FLASH=deepseek-v4-flash
          DATABASE_URL=sqlite+aiosqlite:///${APP_DIR}/data/adventurex.db
          AUTO_PROCESS=true
          ENV

      # ── SSH & rsync 上传 ─────────────────────────────────────
      - name: Setup SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${SSH_KEY}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # 检查密钥格式：如果仍是 OpenSSH 新格式，尝试原地转为 PEM
          if grep -q 'BEGIN OPENSSH PRIVATE KEY' ~/.ssh/deploy_key; then
            echo "==> 检测到 OpenSSH 新格式密钥，正在转换为 PEM 格式..."
            ssh-keygen -p -m PEM -f ~/.ssh/deploy_key -N '' 2>/dev/null || {
              echo "WARNING: 密钥格式转换失败，继续使用原格式（可能不被 CI 支持）"
            }
          fi
          # 打印格式确认
          head -1 ~/.ssh/deploy_key
          ssh-keyscan -p ${REMOTE_PORT} -H ${REMOTE_HOST} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Rsync to server
        run: |
          # 先上传到 /tmp 避免中途覆盖运行中的文件
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key -p ${REMOTE_PORT}" \
            deploy/ ${REMOTE_USER}@${REMOTE_HOST}:/tmp/lumen-deploy/

      # ── 服务器端安装 + 重启 ────────────────────────────────
      - name: Install & restart on server
        run: |
          ssh -i ~/.ssh/deploy_key -p ${REMOTE_PORT} \
              ${REMOTE_USER}@${REMOTE_HOST} 'bash -s' <<'REMOTE'
          set -euo pipefail
          APP_DIR=/opt/lumen

          # ── 配置国内镜像源（仅首次，提速 apt/pip） ─────────────────
          MIRROR_DONE="/etc/apt/.mirror-configured"
          if [ ! -f "$MIRROR_DONE" ]; then
            echo "==> 配置国内镜像源 ..."
            # apt: Ubuntu 24.04 使用 Tsinghua 镜像
            sudo sed -i 's|http://.*archive.ubuntu.com|http://mirrors.tuna.tsinghua.edu.cn|g' /etc/apt/sources.list.d/*.sources 2>/dev/null || true
            sudo sed -i 's|http://.*archive.ubuntu.com|http://mirrors.tuna.tsinghua.edu.cn|g' /etc/apt/sources.list 2>/dev/null || true
            # pip: 全局配置 Tsinghua PyPI 镜像
            sudo mkdir -p /etc/pip
            printf '[global]\nindex-url = https://pypi.tuna.tsinghua.edu.cn/simple\ntrusted-host = pypi.tuna.tsinghua.edu.cn\n' | sudo tee /etc/pip/pip.conf >/dev/null
            sudo touch "$MIRROR_DONE"
          fi

          # 首次部署：装依赖、建用户、建目录
          if [ ! -d "$APP_DIR" ]; then
            echo "==> 首次部署，初始化环境 ..."
            sudo apt-get update -qq
            sudo apt-get install -y -qq python3 python3-venv python3-pip
            sudo id lumen &>/dev/null || sudo useradd -r -s /bin/false -d $APP_DIR lumen
            sudo mkdir -p $APP_DIR/data
          fi

          # 停服（首次没这个 unit 不报错）
          sudo systemctl stop lumen 2>/dev/null || true

          # 同步文件（保留 data/ 和 backend/.venv/）
          sudo mkdir -p $APP_DIR/backend $APP_DIR/static
          sudo rsync -a --delete \
              --exclude='.venv' --exclude='certs' \
              /tmp/lumen-deploy/backend/ $APP_DIR/backend/
          # certs 单独同步以保留私钥权限
          sudo rsync -a /tmp/lumen-deploy/backend/certs/ $APP_DIR/backend/certs/
          sudo rsync -a --delete /tmp/lumen-deploy/static/ $APP_DIR/static/
          sudo cp /tmp/lumen-deploy/lumen.env $APP_DIR/.env
          sudo chmod 600 $APP_DIR/.env

          # venv：首次创建，之后只跟依赖变化 upgrade
          if [ ! -x $APP_DIR/backend/.venv/bin/python ]; then
            echo "==> 创建 venv ..."
            sudo python3 -m venv $APP_DIR/backend/.venv
          fi
          sudo $APP_DIR/backend/.venv/bin/pip install --upgrade pip -q
          sudo env PYO3_USE_ABI3_FORWARD_COMPATIBILITY=1 $APP_DIR/backend/.venv/bin/pip install -r $APP_DIR/backend/requirements.txt -q

          # 权限
          sudo chown -R lumen:lumen $APP_DIR

          # systemd（首次或更新时都覆盖）
          sudo tee /etc/systemd/system/lumen.service >/dev/null <<'UNIT'
          [Unit]
          Description=拾光 · Lumen API
          After=network-online.target
          Wants=network-online.target

          [Service]
          Type=simple
          User=lumen
          Group=lumen
          WorkingDirectory=/opt/lumen/backend
          EnvironmentFile=/opt/lumen/.env
          ExecStart=/opt/lumen/backend/.venv/bin/python -m uvicorn main:app --host 127.0.0.1 --port 8000
          Restart=always
          RestartSec=3
          NoNewPrivileges=yes
          PrivateTmp=yes
          ProtectSystem=strict
          ReadWritePaths=/opt/lumen/data

          [Install]
          WantedBy=multi-user.target
          UNIT

          # ── nginx 安装 + 配置 ────────────────────────────────
          if ! command -v nginx &>/dev/null; then
            echo "==> 安装 nginx ..."
            sudo apt-get install -y -qq nginx
            # 删除默认站点
            sudo rm -f /etc/nginx/sites-enabled/default
          fi

          SSL_CERT="/etc/nginx/ssl/lumen/guppy.ltd_bundle.crt"
          SSL_KEY="/etc/nginx/ssl/lumen/guppy.ltd.key"
          HAS_SSL=false
          if [ -f "$SSL_CERT" ] && [ -f "$SSL_KEY" ]; then
            HAS_SSL=true
            echo "✓ 检测到 SSL 证书，启用 HTTPS"
          else
            echo "⚠ 未检测到 SSL 证书，仅启用 HTTP"
          fi

          sudo tee /etc/nginx/sites-available/lumen >/dev/null <<'NGINX'
          # HTTP → 强制跳转 HTTPS（仅在有证书时），default_server 避免冲突
          server {
              listen 80 default_server;
              server_name guppy.ltd *.guppy.ltd;
              # __REDIRECT__ 会被脚本替换为 return 301（有证书时）或删除（无证书时）
              location /.well-known/acme-challenge/ { root /var/www/html; }

              # 静态资源
              location /assets/  { root /opt/lumen/static; expires 30d; add_header Cache-Control "public, immutable"; }
              location /webfonts/ { root /opt/lumen/static; expires 30d; add_header Cache-Control "public, immutable"; }
              location /favicon.svg { root /opt/lumen/static; expires 7d; }
              location /icons.svg   { root /opt/lumen/static; expires 7d; }

              # API + WebSocket
              location /api/ {
                  proxy_pass http://127.0.0.1:8000;
                  proxy_http_version 1.1;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
                  proxy_read_timeout 120s;
              }
              location /api/asr/ws {
                  proxy_pass http://127.0.0.1:8000;
                  proxy_http_version 1.1;
                  proxy_set_header Upgrade $http_upgrade;
                  proxy_set_header Connection "upgrade";
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_read_timeout 3600s;
                  proxy_send_timeout 3600s;
              }

              # SPA 回退
              location / {
                  root /opt/lumen/static;
                  try_files $uri $uri/ /index.html;
              }
          }
          NGINX

          if $HAS_SSL; then
            # 替换占位符为 HTTPS 强制跳转
            sudo sed -i 's|__REDIRECT__|return 301 https://$host$request_uri;|' /etc/nginx/sites-available/lumen
            # 追加 HTTPS server block
            sudo tee -a /etc/nginx/sites-available/lumen >/dev/null <<'NGINXSSL'

          server {
              listen 443 ssl;
              http2 on;
              server_name guppy.ltd *.guppy.ltd;

              ssl_certificate     /etc/nginx/ssl/lumen/guppy.ltd_bundle.crt;
              ssl_certificate_key /etc/nginx/ssl/lumen/guppy.ltd.key;
              ssl_protocols TLSv1.2 TLSv1.3;
              ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
              ssl_prefer_server_ciphers on;
              ssl_session_cache shared:SSL:10m;
              add_header Strict-Transport-Security "max-age=63072000" always;

              location /assets/  { root /opt/lumen/static; expires 30d; add_header Cache-Control "public, immutable"; }
              location /webfonts/ { root /opt/lumen/static; expires 30d; add_header Cache-Control "public, immutable"; }
              location /favicon.svg { root /opt/lumen/static; expires 7d; }
              location /icons.svg   { root /opt/lumen/static; expires 7d; }

              location /api/ {
                  proxy_pass http://127.0.0.1:8000;
                  proxy_http_version 1.1;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto https;
                  proxy_read_timeout 120s;
              }
              location /api/asr/ws {
                  proxy_pass http://127.0.0.1:8000;
                  proxy_http_version 1.1;
                  proxy_set_header Upgrade $http_upgrade;
                  proxy_set_header Connection "upgrade";
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_read_timeout 3600s;
                  proxy_send_timeout 3600s;
              }

              location / {
                  root /opt/lumen/static;
                  try_files $uri $uri/ /index.html;
              }
          }
          NGINXSSL
          else
            # 无证书：移除占位符（HTTP only）
            sudo sed -i '/__REDIRECT__/d' /etc/nginx/sites-available/lumen
          fi

          sudo ln -sf /etc/nginx/sites-available/lumen /etc/nginx/sites-enabled/lumen
          sudo nginx -t && sudo systemctl restart nginx || { echo "✗ nginx 配置错误"; sudo nginx -t; exit 1; }

          sudo systemctl daemon-reload
          sudo systemctl enable lumen 2>/dev/null || true
          sudo systemctl restart lumen || { echo "✗ lumen 启动失败"; sudo journalctl -u lumen -n 30 --no-pager; exit 1; }

          # 清理临时文件
          rm -rf /tmp/lumen-deploy

          # 等 3 秒后自检
          sleep 3
          OK=true
          if sudo systemctl is-active --quiet lumen; then
            echo "✓ lumen 服务运行中"
          else
            echo "✗ lumen 启动失败"
            sudo journalctl -u lumen -n 30 --no-pager
            OK=false
          fi
          if sudo systemctl is-active --quiet nginx; then
            echo "✓ nginx 运行中"
            CURL_OPTS="-sf"
            # 有证书时跳过证书验证（CI 自检 localhost，证书域名不匹配）
            if $HAS_SSL; then CURL_OPTS="-sfk"; fi
            curl $CURL_OPTS https://127.0.0.1:443/api/health 2>/dev/null && echo "" || \
            curl -sf http://127.0.0.1:80/api/health && echo "" || {
              echo "✗ nginx → 后端健康检查失败"
              sudo journalctl -u nginx -n 10 --no-pager
              curl -v http://127.0.0.1:8000/api/health 2>&1 || true
              OK=false
            }
          else
            echo "✗ nginx 未启动"
            OK=false
          fi
          [ "$OK" = "false" ] && exit 1
          REMOTE

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key

      - name: Deployment summary
        if: success()
        run: |
          echo "## ✅ 部署完成" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- 目标: \`${REMOTE_HOST}\`" >> $GITHUB_STEP_SUMMARY
          echo "- 中继: \`https://${RELAY_HOST}/v1\`（自签 CA 校验）" >> $GITHUB_STEP_SUMMARY
          echo "- 提交: \`${GITHUB_SHA:0:7}\`" >> $GITHUB_STEP_SUMMARY
